# Prometheus for the docker localnet (make localnet-monitoring; design §16).
global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: keystone
    static_configs:
      - targets: [node0:26660, node1:26660, node2:26660, node3:26660]
