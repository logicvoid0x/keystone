# Example public endpoint (spec M6-T5): one node's CometBFT RPC (26657), REST API (1317)
# and gRPC (9090) behind per-client rate limits. Adjust server_name and TLS.
limit_req_zone $binary_remote_addr zone=keystone_rpc:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=keystone_conn:10m;

server {
    listen 80;
    server_name rpc.signet.keystone.example;
    limit_req zone=keystone_rpc burst=200 nodelay;
    limit_conn keystone_conn 50;
    client_max_body_size 1m;

    # CometBFT RPC; unsafe routes are off in config.toml (rpc.unsafe = false).
    location / {
        proxy_pass http://127.0.0.1:26657;
        proxy_set_header Host $host;
    }
    location /websocket {
        proxy_pass http://127.0.0.1:26657/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 81;
    server_name api.signet.keystone.example;
    limit_req zone=keystone_rpc burst=200 nodelay;
    location / { proxy_pass http://127.0.0.1:1317; }
}

server {
    listen 9091 http2;
    server_name grpc.signet.keystone.example;
    limit_req zone=keystone_rpc burst=200 nodelay;
    location / { grpc_pass grpc://127.0.0.1:9090; }
}
