# 4-operator Keystone localnet (specs M2-T1, M3-T1). Homes come from
#   keystoned testnet init-files --operators 4 --docker --dev-dealer --output localnet/homes
# and are bind-mounted, so they survive `make localnet-stop`.
# Host ports per node i: RPC 26657+10i, gRPC 9090+10i, Prometheus 26660+10i.
# node3 can be restarted as a byzantine proposer: make localnet-byz MODE=extra_magic.
# node4 (profile "extra") is the 5th validator added by scripts/add-validator.sh.
# Each node i follows its own regtest bitcoind, bitcoin<i> (RPC 18443, ZMQ hashblock
# 28333, user/password keystone/keystone); the bitcoinds peer with each other. Chain
# data lives in named volumes: localnet-stop keeps it, localnet-clean removes it.
# localnet/mine.sh N mines N blocks to the faucet wallet on bitcoin0.
name: keystone-localnet

x-node: &node
  image: keystone-localnet:latest
  restart: unless-stopped
  # NODE_BIN=keystoned-pre-v2 runs the pre-v2 release (scripts/upgrade-drill.sh).
  command: ["sh", "-c", "exec ${NODE_BIN:-keystoned} start --home /home/keystone"]

x-bitcoind: &bitcoind
  image: bitcoin/bitcoin:31.1
  restart: unless-stopped
  entrypoint: ["bitcoind"]

services:
  mockfeed:
    build:
      context: ..
      dockerfile: localnet/Dockerfile
    image: keystone-localnet:latest
    command: ["mockfeed", "--listen", "0.0.0.0:18080", "--price", "100000"]
    ports: ["18080:18080"]

  bitcoin0:
    <<: *bitcoind
    command: [-regtest, -printtoconsole, -server, -txindex=0, -fallbackfee=0.0002, -rpcbind=0.0.0.0, -rpcallowip=0.0.0.0/0,
      -rpcuser=keystone, -rpcpassword=keystone, -zmqpubrawblock=tcp://0.0.0.0:28332, -zmqpubhashblock=tcp://0.0.0.0:28333,
      -addnode=bitcoin1:18444, -addnode=bitcoin2:18444, -addnode=bitcoin3:18444]
    volumes: ["bitcoin0:/root/.bitcoin"]
    ports: ["18443:18443"]

  bitcoin1:
    <<: *bitcoind
    command: [-regtest, -printtoconsole, -server, -txindex=0, -fallbackfee=0.0002, -rpcbind=0.0.0.0, -rpcallowip=0.0.0.0/0,
      -rpcuser=keystone, -rpcpassword=keystone, -zmqpubrawblock=tcp://0.0.0.0:28332, -zmqpubhashblock=tcp://0.0.0.0:28333,
      -addnode=bitcoin0:18444, -addnode=bitcoin2:18444, -addnode=bitcoin3:18444]
    volumes: ["bitcoin1:/root/.bitcoin"]

  bitcoin2:
    <<: *bitcoind
    command: [-regtest, -printtoconsole, -server, -txindex=0, -fallbackfee=0.0002, -rpcbind=0.0.0.0, -rpcallowip=0.0.0.0/0,
      -rpcuser=keystone, -rpcpassword=keystone, -zmqpubrawblock=tcp://0.0.0.0:28332, -zmqpubhashblock=tcp://0.0.0.0:28333,
      -addnode=bitcoin0:18444, -addnode=bitcoin1:18444, -addnode=bitcoin3:18444]
    volumes: ["bitcoin2:/root/.bitcoin"]

  bitcoin3:
    <<: *bitcoind
    command: [-regtest, -printtoconsole, -server, -txindex=0, -fallbackfee=0.0002, -rpcbind=0.0.0.0, -rpcallowip=0.0.0.0/0,
      -rpcuser=keystone, -rpcpassword=keystone, -zmqpubrawblock=tcp://0.0.0.0:28332, -zmqpubhashblock=tcp://0.0.0.0:28333,
      -addnode=bitcoin0:18444, -addnode=bitcoin1:18444, -addnode=bitcoin2:18444]
    volumes: ["bitcoin3:/root/.bitcoin"]

  bitcoin4:
    <<: *bitcoind
    profiles: [extra]
    command: [-regtest, -printtoconsole, -server, -txindex=0, -fallbackfee=0.0002, -rpcbind=0.0.0.0, -rpcallowip=0.0.0.0/0,
      -rpcuser=keystone, -rpcpassword=keystone, -zmqpubrawblock=tcp://0.0.0.0:28332, -zmqpubhashblock=tcp://0.0.0.0:28333,
      -addnode=bitcoin0:18444, -addnode=bitcoin1:18444, -addnode=bitcoin2:18444, -addnode=bitcoin3:18444]
    volumes: ["bitcoin4:/root/.bitcoin"]

  node0:
    <<: *node
    depends_on: [mockfeed, bitcoin0]
    volumes: ["./homes/node0:/home/keystone"]
    ports: ["26657:26657", "9090:9090", "26660:26660"]

  node1:
    <<: *node
    depends_on: [mockfeed, bitcoin1]
    volumes: ["./homes/node1:/home/keystone"]
    ports: ["26667:26657", "9100:9090", "26670:26660"]

  node2:
    <<: *node
    depends_on: [mockfeed, bitcoin2]
    volumes: ["./homes/node2:/home/keystone"]
    ports: ["26677:26657", "9110:9090", "26680:26660"]

  node3:
    <<: *node
    depends_on: [mockfeed, bitcoin3]
    command: ["sh", "-c", "exec ${NODE3_BIN:-keystoned} start --home /home/keystone"]
    environment:
      KEYSTONE_BYZ: ${KEYSTONE_BYZ:-}
      # make localnet-signer3 SIGNER=false stops node3's FROST signer (demo-M4a).
      KEYSTONED_KEYSTONE_SIGNER_ENABLED: ${NODE3_SIGNER:-true}
    volumes: ["./homes/node3:/home/keystone"]
    ports: ["26687:26657", "9120:9090", "26690:26660"]

  node4:
    <<: *node
    profiles: [extra]
    depends_on: [mockfeed, bitcoin4]
    volumes: ["./homes/node4:/home/keystone"]
    ports: ["26697:26657", "9130:9090", "26700:26660"]

  # Monitoring (design §16): make localnet-monitoring; Grafana on http://127.0.0.1:3000
  # (anonymous viewer), Prometheus with the §16 alerts on http://127.0.0.1:9095.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9095:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [monitoring]
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  bitcoin0:
  bitcoin1:
  bitcoin2:
  bitcoin3:
  bitcoin4:
