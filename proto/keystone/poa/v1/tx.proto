syntax = "proto3";
package keystone.poa.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "keystone/poa/v1/poa.proto";

option go_package = "github.com/OWNER/keystone/x/poa/types";

// Msg is the x/poa Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // SetValidators adds (power 1) or removes (power 0) operators. Admin only.
  rpc SetValidators(MsgSetValidators) returns (MsgSetValidatorsResponse);
  // UpdateParams replaces the params, including the admin. Admin only.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
}

// MsgSetValidators sets operator records. Entries are sorted by operator address bytes.
message MsgSetValidators {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "keystone/poa/MsgSetValidators";

  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  repeated ValidatorEntry entries = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgSetValidatorsResponse is the response to MsgSetValidators.
message MsgSetValidatorsResponse {}

// MsgUpdateParams replaces the x/poa params.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "keystone/poa/MsgUpdateParams";

  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse is the response to MsgUpdateParams.
message MsgUpdateParamsResponse {}
