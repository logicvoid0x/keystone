syntax = "proto3";
package keystone.poa.v1;

import "amino/amino.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "keystone/poa/v1/poa.proto";

option go_package = "github.com/OWNER/keystone/x/poa/types";

// Query is the x/poa query service.
service Query {
  // Params returns the x/poa params.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/keystone/poa/v1/params";
  }
  // Validators returns every operator record, sorted by operator address.
  rpc Validators(QueryValidatorsRequest) returns (QueryValidatorsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/keystone/poa/v1/validators";
  }
  // Validator returns one operator record.
  rpc Validator(QueryValidatorRequest) returns (QueryValidatorResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/keystone/poa/v1/validators/{address}";
  }
  // TotalPower returns the sum of operator powers.
  rpc TotalPower(QueryTotalPowerRequest) returns (QueryTotalPowerResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/keystone/poa/v1/total_power";
  }
}

// QueryParamsRequest is the request for Query/Params.
message QueryParamsRequest {}

// QueryParamsResponse is the response for Query/Params.
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryValidatorsRequest is the request for Query/Validators.
message QueryValidatorsRequest {}

// QueryValidatorsResponse is the response for Query/Validators.
message QueryValidatorsResponse {
  repeated Operator validators = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryValidatorRequest is the request for Query/Validator.
message QueryValidatorRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryValidatorResponse is the response for Query/Validator.
message QueryValidatorResponse {
  Operator validator = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryTotalPowerRequest is the request for Query/TotalPower.
message QueryTotalPowerRequest {}

// QueryTotalPowerResponse is the response for Query/TotalPower.
message QueryTotalPowerResponse {
  int64 total_power = 1;
}
