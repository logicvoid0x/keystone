syntax = "proto3";
package keystone.poa.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "keystone/poa/v1/poa.proto";

option go_package = "github.com/OWNER/keystone/x/poa/types";

// GenesisState is the x/poa genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  // operators are sorted by operator address bytes, without duplicates.
  repeated Operator operators = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}
