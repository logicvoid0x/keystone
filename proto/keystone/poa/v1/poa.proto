syntax = "proto3";
package keystone.poa.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/OWNER/keystone/x/poa/types";

// Params are the x/poa parameters.
message Params {
  option (amino.name) = "keystone/x/poa/Params";
  // admin is the operators' multisig address. It is the authority for every
  // Keystone MsgUpdateParams and for x/upgrade.
  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// Operator is a validator record. Records are never deleted, only set to power 0.
message Operator {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // consensus_pubkey is the raw 32-byte ed25519 key.
  bytes consensus_pubkey = 2;
  string moniker = 3;
  // power is 0 (removed) or 1 (active).
  int64 power = 4;
}

// ValidatorEntry is one entry of MsgSetValidators.
message ValidatorEntry {
  string operator_address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes consensus_pubkey = 2;
  string moniker = 3;
  int64 power = 4;
}
