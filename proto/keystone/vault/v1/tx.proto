syntax = "proto3";
package keystone.vault.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "keystone/vault/v1/params.proto";

option go_package = "github.com/OWNER/keystone/x/vault/types";

// Msg is the x/vault Msg service (design §11.1).
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams replaces the params. Signed by the x/poa admin.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // OpenVault opens a new vault.
  rpc OpenVault(MsgOpenVault) returns (MsgOpenVaultResponse);
  // Mint mints KUSD against a vault.
  rpc Mint(MsgMint) returns (MsgMintResponse);
  // Repay burns KUSD against a vault's debt. Anyone may repay.
  rpc Repay(MsgRepay) returns (MsgRepayResponse);
  // WithdrawCollateral debits collateral (M1: to the owner's claimable balance).
  rpc WithdrawCollateral(MsgWithdrawCollateral) returns (MsgWithdrawCollateralResponse);
  // CloseVault withdraws all collateral from a vault with no debt and closes it.
  rpc CloseVault(MsgCloseVault) returns (MsgCloseVaultResponse);
  // DepositClaim moves claimable BTC into a vault.
  rpc DepositClaim(MsgDepositClaim) returns (MsgDepositClaimResponse);
}

// MsgUpdateParams replaces the x/vault params.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "keystone/vault/MsgUpdateParams";

  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse is the response to MsgUpdateParams.
message MsgUpdateParamsResponse {}

// MsgOpenVault opens a vault owned by the signer.
message MsgOpenVault {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "keystone/vault/MsgOpenVault";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgOpenVaultResponse returns the new vault id and its deposit address (bech32m;
// empty while no custody epoch is ACTIVE).
message MsgOpenVaultResponse {
  uint64 vault_id = 1;
  string address = 2;
}

// MsgMint mints amount ukusd against a vault.
message MsgMint {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "keystone/vault/MsgMint";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 vault_id = 2;
  string amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgMintResponse is the response to MsgMint.
message MsgMintResponse {}

// MsgRepay burns up to amount ukusd from the sender against a vault's debt.
message MsgRepay {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "keystone/vault/MsgRepay";

  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 vault_id = 2;
  string amount = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgRepayResponse returns the amount actually burned.
message MsgRepayResponse {
  string repaid = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgWithdrawCollateral debits amount_sat of collateral.
message MsgWithdrawCollateral {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "keystone/vault/MsgWithdrawCollateral";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 vault_id = 2;
  string amount_sat = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  // recipient_script is the Bitcoin output script (used from M4a; ignored in M1).
  bytes recipient_script = 4;
}

// MsgWithdrawCollateralResponse is the response to MsgWithdrawCollateral.
message MsgWithdrawCollateralResponse {}

// MsgCloseVault closes a vault with no debt, withdrawing all collateral.
message MsgCloseVault {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "keystone/vault/MsgCloseVault";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 vault_id = 2;
  // recipient_script is the Bitcoin output script (used from M4a; ignored in M1).
  bytes recipient_script = 3;
}

// MsgCloseVaultResponse is the response to MsgCloseVault.
message MsgCloseVaultResponse {}

// MsgDepositClaim moves amount_sat of the owner's claimable BTC into a vault.
message MsgDepositClaim {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "keystone/vault/MsgDepositClaim";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 vault_id = 2;
  string amount_sat = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgDepositClaimResponse is the response to MsgDepositClaim.
message MsgDepositClaimResponse {}
