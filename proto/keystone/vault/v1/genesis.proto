syntax = "proto3";
package keystone.vault.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "keystone/vault/v1/params.proto";

option go_package = "github.com/OWNER/keystone/x/vault/types";

// GenesisState is the x/vault genesis state.
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}
