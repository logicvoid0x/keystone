syntax = "proto3";
package keystone.vault.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/OWNER/keystone/x/vault/types";

// DevMsg is a development-only service. Its handler is registered only in binaries
// built with the `devcredit` build tag (M1); it is removed in M3.
service DevMsg {
  option (cosmos.msg.v1.service) = true;

  // DevCreditCollateral credits collateral to a vault without a Bitcoin deposit.
  rpc DevCreditCollateral(MsgDevCreditCollateral) returns (MsgDevCreditCollateralResponse);
}

// MsgDevCreditCollateral credits sat to a vault (within cap headroom; any excess goes
// to the owner's claimable balance). Signed by the x/poa admin.
message MsgDevCreditCollateral {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "keystone/vault/MsgDevCreditCollateral";

  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 vault_id = 2;
  string sat = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgDevCreditCollateralResponse is the response to MsgDevCreditCollateral.
message MsgDevCreditCollateralResponse {}
