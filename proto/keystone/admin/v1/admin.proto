syntax = "proto3";
package keystone.admin.v1;

import "amino/amino.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/OWNER/keystone/x/admin/types";

// Params are the x/admin parameters (design §4.2).
message Params {
  option (amino.name) = "keystone/x/admin/Params";
  // admin is the admin multisig address. It is the authority for every Keystone
  // MsgUpdateParams, x/upgrade, x/consensus, the SDK modules' params (through
  // MsgExec) and the validator allowlist.
  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// AllowEntry admits one validator operator. The operator is an account address; its
// bytes are the validator operator (valoper) address bytes.
message AllowEntry {
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string moniker = 2;
  int64 added_height = 3;
}
