syntax = "proto3";
package keystone.custody.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "keystone/custody/v1/custody.proto";
import "keystone/custody/v1/params.proto";

option go_package = "github.com/OWNER/keystone/x/custody/types";

// GenesisState is the x/custody genesis state. Epochs at genesis exist only on localnet
// chain ids (`--dev-dealer`, design §9.3); otherwise the epoch-1 DKG creates them.
// Repeated fields are sorted: epochs by number, share_indices by (epoch, index),
// verifying_shares by (epoch, index).
message GenesisState {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated KeyEpoch epochs = 2 [(gogoproto.nullable) = false];
  // active_epoch is 0 when no epoch is ACTIVE.
  uint64 active_epoch = 3;
  repeated ShareIndex share_indices = 4 [(gogoproto.nullable) = false];
  repeated VerifyingShare verifying_shares = 5 [(gogoproto.nullable) = false];
  // custody_keys are the operators' DKG encryption and hot keys (M4b), sorted by
  // operator.
  repeated CustodyKey custody_keys = 6 [(gogoproto.nullable) = false];
}
