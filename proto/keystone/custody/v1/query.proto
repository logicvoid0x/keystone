syntax = "proto3";
package keystone.custody.v1;

import "amino/amino.proto";
import "cosmos/query/v1/query.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "keystone/custody/v1/params.proto";

option go_package = "github.com/OWNER/keystone/x/custody/types";

// Query is the x/custody query service (M1 stub: params and claimable balances).
service Query {
  // Params returns the x/custody params.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/keystone/custody/v1/params";
  }
  // Claimable returns an account's claimable BTC balance in satoshis.
  rpc Claimable(QueryClaimableRequest) returns (QueryClaimableResponse) {
    option (cosmos.query.v1.module_query_safe) = true;
    option (google.api.http).get = "/keystone/custody/v1/claimable/{address}";
  }
}

// QueryParamsRequest is the request for Query/Params.
message QueryParamsRequest {}

// QueryParamsResponse is the response for Query/Params.
message QueryParamsResponse {
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// QueryClaimableRequest is the request for Query/Claimable.
message QueryClaimableRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// QueryClaimableResponse is the response for Query/Claimable.
message QueryClaimableResponse {
  string claimable_sat = 1 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
