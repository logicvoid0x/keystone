syntax = "proto3";
package keystone.custody.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "keystone/custody/v1/custody.proto";
import "keystone/custody/v1/params.proto";

option go_package = "github.com/OWNER/keystone/x/custody/types";

// Msg is the x/custody Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams replaces the params. Signed by the x/poa admin.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);
  // ClearTheftPause re-enables deposits after an unauthorized spend, once the slashed
  // epoch is no longer ACTIVE. Admin only (design §9.12, added in M7).
  rpc ClearTheftPause(MsgClearTheftPause) returns (MsgClearTheftPauseResponse);

  // WithdrawClaim queues a payout of claimable satoshis.
  rpc WithdrawClaim(MsgWithdrawClaim) returns (MsgWithdrawClaimResponse);

  // RegisterCustodyKey sets the operator's DKG encryption key and hot key.
  rpc RegisterCustodyKey(MsgRegisterCustodyKey) returns (MsgRegisterCustodyKeyResponse);

  // DKGCommit, DKGDeal and DKGComplaint are the DKG rounds (design §9.3).
  rpc DKGCommit(MsgDKGCommit) returns (MsgDKGCommitResponse);
  rpc DKGDeal(MsgDKGDeal) returns (MsgDKGDealResponse);
  rpc DKGComplaint(MsgDKGComplaint) returns (MsgDKGComplaintResponse);
}

// MsgUpdateParams replaces the x/custody params.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "keystone/custody/MsgUpdateParams";

  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse is the response to MsgUpdateParams.
message MsgUpdateParamsResponse {}

// MsgClearTheftPause clears theft_paused (design §9.12, added in M7).
message MsgClearTheftPause {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "keystone/custody/MsgClearTheftPause";

  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgClearTheftPauseResponse is the response to MsgClearTheftPause.
message MsgClearTheftPauseResponse {}

// MsgWithdrawClaim withdraws amount_sat of the owner's claimable balance to a Bitcoin
// script (P2TR, P2WPKH or P2WSH; design §9.8 step 1).
message MsgWithdrawClaim {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "keystone/custody/MsgWithdrawClaim";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes recipient_script = 2;
  string amount_sat = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgWithdrawClaimResponse carries the queued request's id.
message MsgWithdrawClaimResponse {
  uint64 request_id = 1;
}

// MsgRegisterCustodyKey sets an operator's DKG encryption key and custody hot key
// (operators added after genesis; design §11.1).
message MsgRegisterCustodyKey {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "keystone/custody/MsgRegisterCustodyKey";

  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes enc_pubkey = 2;
  string hot_key = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRegisterCustodyKeyResponse is the response to MsgRegisterCustodyKey.
message MsgRegisterCustodyKeyResponse {}

// MsgDKGCommit is a dealer's DKG commitment (design §9.3 step 1), signed by its hot key.
message MsgDKGCommit {
  option (cosmos.msg.v1.signer) = "hot_key";
  option (amino.name) = "keystone/custody/MsgDKGCommit";

  string hot_key = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch = 2;
  repeated bytes commitments = 3;
  bytes proof = 4;
}

// MsgDKGCommitResponse is the response to MsgDKGCommit.
message MsgDKGCommitResponse {}

// MsgDKGDeal is a dealer's encrypted shares (step 2), signed by its hot key.
message MsgDKGDeal {
  option (cosmos.msg.v1.signer) = "hot_key";
  option (amino.name) = "keystone/custody/MsgDKGDeal";

  string hot_key = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch = 2;
  repeated DKGCiphertext ciphertexts = 3 [(gogoproto.nullable) = false];
}

// MsgDKGDealResponse is the response to MsgDKGDeal.
message MsgDKGDealResponse {}

// MsgDKGComplaint accuses a dealer of a bad share (step 3): the ECDH secret between
// the complainer's and the dealer's encryption keys, with a DLEQ proof that it is
// correct, lets the chain decrypt and check the share.
message MsgDKGComplaint {
  option (cosmos.msg.v1.signer) = "hot_key";
  option (amino.name) = "keystone/custody/MsgDKGComplaint";

  string hot_key = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 epoch = 2;
  string dealer = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes ecdh_secret = 4;
  bytes dleq_proof = 5;
}

// MsgDKGComplaintResponse carries the verdict.
message MsgDKGComplaintResponse {
  bool upheld = 1;
}
