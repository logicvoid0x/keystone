syntax = "proto3";
package keystone.custody.v1;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "keystone/custody/v1/params.proto";

option go_package = "github.com/OWNER/keystone/x/custody/types";

// Msg is the x/custody Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams replaces the params. Signed by the x/poa admin.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // WithdrawClaim queues a payout of claimable satoshis.
  rpc WithdrawClaim(MsgWithdrawClaim) returns (MsgWithdrawClaimResponse);
}

// MsgUpdateParams replaces the x/custody params.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "admin";
  option (amino.name) = "keystone/custody/MsgUpdateParams";

  string admin = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse is the response to MsgUpdateParams.
message MsgUpdateParamsResponse {}

// MsgWithdrawClaim withdraws amount_sat of the owner's claimable balance to a Bitcoin
// script (P2TR, P2WPKH or P2WSH; design §9.8 step 1).
message MsgWithdrawClaim {
  option (cosmos.msg.v1.signer) = "owner";
  option (amino.name) = "keystone/custody/MsgWithdrawClaim";

  string owner = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  bytes recipient_script = 2;
  string amount_sat = 3 [
    (cosmos_proto.scalar) = "cosmos.Int",
    (gogoproto.customtype) = "cosmossdk.io/math.Int",
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgWithdrawClaimResponse carries the queued request's id.
message MsgWithdrawClaimResponse {
  uint64 request_id = 1;
}
